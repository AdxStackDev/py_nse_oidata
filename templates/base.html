<!DOCTYPE html>
<html lang="en" class="h-full scroll-smooth">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description"
        content="NSE F&O participant-wise open interest analytics: FII, DII, PRO and retail positioning.">
    <title>{% block title %}NSE F&O Analytics{% endblock %}</title>
    <link rel="icon" type="image/svg+xml"
        href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%232563eb' stroke-width='2.5' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M3 17l6-6 4 4 8-8M15 7h6v6'/%3E%3C/svg%3E">

    <!-- Apply saved theme BEFORE first paint to avoid a light/dark flash -->
    <script>
        (function () {
            try {
                var t = localStorage.getItem('theme');
                if (t === 'dark' || (!t && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
                    document.documentElement.classList.add('dark');
                }
            } catch (e) { }
        })();
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap"
        rel="stylesheet">

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'system-ui', 'sans-serif'],
                        mono: ['JetBrains Mono', 'ui-monospace', 'monospace']
                    }
                }
            }
        };
    </script>
    <style type="text/tailwindcss">
        @layer components {
            .card { @apply bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-xl shadow-sm; }
            .card-head { @apply px-5 py-3.5 border-b border-slate-200 dark:border-slate-800 flex items-center justify-between gap-3; }
            .card-title { @apply text-sm font-semibold text-slate-900 dark:text-slate-100; }
            .card-sub { @apply text-xs text-slate-500 dark:text-slate-400 mt-0.5; }
            .eyebrow { @apply text-[11px] font-semibold uppercase tracking-wider text-slate-500 dark:text-slate-400; }
            .tab-btn { @apply px-4 py-2 text-sm font-medium rounded-lg text-slate-600 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors whitespace-nowrap; }
            .tab-btn.active { @apply bg-slate-900 text-white dark:bg-white dark:text-slate-900 hover:bg-slate-900 dark:hover:bg-white; }
        }
    </style>

    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
</head>

<body class="h-full bg-slate-50 dark:bg-slate-950 text-slate-900 dark:text-slate-100 font-sans antialiased">
    {% block content %}{% endblock %}

    <script>
        /* Theme toggle: persists choice and notifies charts so they can recolour. */
        function toggleTheme() {
            var dark = document.documentElement.classList.toggle('dark');
            try { localStorage.setItem('theme', dark ? 'dark' : 'light'); } catch (e) { }
            document.dispatchEvent(new Event('themechange'));
        }
    </script>
    {% block scripts %}{% endblock %}
</body>

</html>
